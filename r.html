<!DOCTYPE html>
<!--
  Redireccion con registro de CLICS de las campanas de correo de Marketing (campanas_envio.py, 2026-10-26).
  Cada enlace del correo apunta a  <url_publica>/r.html?t=<token del envio>&n=<n.o de enlace>&d=<destino base64>.
  La funcion anexo_v5.mkt_clic(token, n) registra el clic y devuelve el destino GUARDADO para ese correo: se
  redirige a ese, nunca al parametro "d" (asi nadie puede usar esta pagina para mandar a otro sitio). "d" solo se
  ofrece como boton si Supabase no responde, mostrando a que sitio lleva.
  Solo caracteres ASCII. Publicar junto a baja.html.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Test &amp; Control</title>
<style>
  body { margin: 0; background: #eef2f7; font-family: Arial, Helvetica, sans-serif; color: #283e57; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .caja { text-align: center; max-width: 420px; }
  .spin { width: 34px; height: 34px; border: 4px solid #dce6f0; border-top-color: #1767b1; border-radius: 50%; margin: 0 auto 14px; animation: g 0.8s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  a.btn { display: inline-block; margin-top: 12px; background: #1767b1; color: #fff; text-decoration: none; padding: 12px 18px; border-radius: 8px; font-weight: bold; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="caja">
  <div id="cargando"><div class="spin"></div>Abriendo el enlace...</div>
  <div id="manual" hidden>No pudimos abrir el enlace autom&aacute;ticamente.<br><a class="btn" id="ir" href="https://www.testcontrol.com.pe/">Continuar</a></div>
</div>
<script>
  const SUPABASE_URL = 'https://zrdlvykhircycpxqjlug.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_PIr9IFkWxzXd7WCqqVg3Cw_yj9nDLj9';
  const q = new URLSearchParams(location.search);
  const token = q.get('t') || '', n = parseInt(q.get('n') || '-1', 10);
  function respaldo() {
    let url = 'https://www.testcontrol.com.pe/';
    try {
      const d = atob((q.get('d') || '').replace(/-/g, '+').replace(/_/g, '/'));
      if (/^https?:\/\//i.test(d)) url = d;
    } catch (e) { }
    const a = document.getElementById('ir');
    a.href = url;
    try { a.textContent = 'Continuar a ' + new URL(url).hostname; } catch (e) { }
    document.getElementById('cargando').hidden = true;
    document.getElementById('manual').hidden = false;
  }
  (async function () {
    if (!/^[0-9a-f]{32}$/.test(token) || !(n >= 0)) { respaldo(); return; }
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/mkt_clic`, {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json',
                   'Content-Profile': 'anexo_v5', 'Accept-Profile': 'anexo_v5' },
        body: JSON.stringify({ p_token: token, p_n: n }),
      });
      const url = r.ok ? await r.json() : null;
      if (typeof url === 'string' && /^https?:\/\//i.test(url)) { location.replace(url); return; }
    } catch (e) { }
    respaldo();
  })();
</script>
</body>
</html>
